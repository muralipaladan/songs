<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>പാട്ട് പ്ലെയർ</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F172A; --panel:#111C34; --accent:#38BDF8; --text:#F8FAFC; --muted:#94A3B8;
  }
  *{box-sizing:border-box;}
  body,html{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:'Anek Malayalam',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;}
  #app{display:flex;height:100vh;width:100vw;}

  /* ---- Song list panel ---- */
  #songListPanel{
    width:260px;min-width:260px;background:var(--panel);border-right:1px solid rgba(255,255,255,0.08);
    display:flex;flex-direction:column;transition:transform .25s ease;
  }
  #songListPanel h1{font-size:18px;padding:16px;margin:0;border-bottom:1px solid rgba(255,255,255,0.08);}
  #songList{list-style:none;margin:0;padding:8px;overflow-y:auto;flex:1;}
  #songList li{
    padding:12px 14px;border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:15px;
    color:var(--muted);transition:background .15s, color .15s;
  }
  #songList li .movie{display:block;font-size:12px;opacity:.7;margin-top:2px;}
  #songList li:active{background:rgba(56,189,248,0.15);}
  #songList li.active{background:rgba(56,189,248,0.18);color:var(--accent);}

  /* ---- Player panel ---- */
  #playerPanel{flex:1;display:flex;flex-direction:column;position:relative;min-width:0;}
  #topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.08);}
  #menuBtn{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;}
  #nowTitle{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  audio{width:100%;display:block;background:var(--panel);outline:none;}

  #lyricsBox{
    flex:1;overflow-y:auto;padding:30px 24px 50vh 24px;scroll-behavior:smooth;
  }
  #lyricsBox .line{
    font-size:19px;line-height:1.9;color:var(--muted);margin-bottom:14px;transition:color .2s;
  }
  #empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;
    color:var(--muted);text-align:center;padding:20px;}
  #empty .play-hint{width:70px;height:70px;border-radius:50%;background:var(--accent);
    display:flex;align-items:center;justify-content:center;font-size:28px;color:#000;margin-bottom:16px;}

  @media (max-width:720px){
    #songListPanel{position:fixed;left:0;top:0;bottom:0;z-index:30;transform:translateX(-100%);width:78vw;}
    #songListPanel.open{transform:translateX(0);}
    #menuBtn{display:block;}
    #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:20;}
    #overlay.show{display:block;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="songListPanel">
    <h1>🎵 പാട്ടുകൾ</h1>
    <ul id="songList"></ul>
  </div>
  <div id="overlay"></div>

  <div id="playerPanel">
    <div id="topbar">
      <button id="menuBtn">☰</button>
      <div id="nowTitle">പാട്ട് തിരഞ്ഞെടുക്കൂ</div>
    </div>
    
    <audio id="player" controls></audio>
    
    <div id="lyricsBox">
      <div id="empty">
        <div class="play-hint">▶</div>
        ഇടതുവശത്ത് നിന്ന് ഒരു പാട്ട് തിരഞ്ഞെടുക്കൂ
      </div>
    </div>
  </div>
</div>

<script>
const songListEl = document.getElementById('songList');
const player = document.getElementById('player');
const lyricsBox = document.getElementById('lyricsBox');
const nowTitle = document.getElementById('nowTitle');
const songListPanel = document.getElementById('songListPanel');
const overlay = document.getElementById('overlay');
const menuBtn = document.getElementById('menuBtn');

let songs = [];
let currentId = null;

menuBtn.onclick = () => { songListPanel.classList.add('open'); overlay.classList.add('show'); };
overlay.onclick = () => { songListPanel.classList.remove('open'); overlay.classList.remove('show'); };

async function loadManifest(){
  const res = await fetch('songs.json', {cache:'no-store'});
  songs = await res.json();
  renderList();
  const lastId = localStorage.getItem('lastSongId');
  const startSong = songs.find(s => s.id === lastId) || null;
  if(startSong) selectSong(startSong.id, false);
}

function renderList(){
  songListEl.innerHTML = '';
  songs.forEach(s => {
    const li = document.createElement('li');
    li.dataset.id = s.id;
    li.innerHTML = `${s.title}${s.movie ? `<span class="movie">${s.movie}</span>` : ''}`;
    li.onclick = () => selectSong(s.id, true);
    songListEl.appendChild(li);
  });
}

async function selectSong(id, autoplay){
  const s = songs.find(x => x.id === id);
  if(!s) return;
  currentId = id;
  localStorage.setItem('lastSongId', id);

  [...songListEl.children].forEach(li => li.classList.toggle('active', li.dataset.id === id));
  nowTitle.textContent = s.title + (s.movie ? ' · ' + s.movie : '');

  player.src = s.song;
  if(autoplay){ player.play().catch(()=>{}); }

  lyricsBox.innerHTML = '';
  try{
    const txt = await (await fetch(s.lyrics, {cache:'no-store'})).text();
    txt.split('\n').forEach(line => {
      const div = document.createElement('div');
      div.className = 'line';
      div.textContent = line.trim() === '' ? '\u00A0' : line;
      lyricsBox.appendChild(div);
    });
  }catch(e){
    lyricsBox.innerHTML = '<div class="line">വരികൾ ലഭ്യമല്ല</div>';
  }

  songListPanel.classList.remove('open');
  overlay.classList.remove('show');
}

// സ്ക്രീനിൽ ടച്ച് ചെയ്യുമ്പോൾ പാട്ട് പ്ലേ / പോസ് ആകാനുള്ള കോഡ്
lyricsBox.addEventListener('click', () => {
  if (!currentId) return; 
  if (player.paused) {
    player.play();
  } else {
    player.pause();
  }
});

loadManifest();
</script>
</body>
</html>
