<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Audio Compressor (16kHz WAV)</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0F172A; --panel: #1E293B; --accent: #38BDF8; --text: #F8FAFC; --muted: #94A3B8; --danger: #EF4444; --success: #10B981; }
  * { box-sizing: border-box; }
  body, html { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Anek Malayalam', sans-serif; }
  
  .container { max-width: 500px; margin: 20px auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
  h1 { font-size: 22px; text-align: center; margin: 0; color: var(--accent); }
  p.desc { font-size: 14px; color: var(--muted); text-align: center; margin-top: -5px; }
  
  .card { background: var(--panel); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 15px; }
  
  input[type="file"] {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px dashed rgba(255,255,255,0.3);
    background: rgba(0,0,0,0.2); color: var(--text); cursor: pointer;
  }
  
  .btn {
    background: var(--accent); color: #000; font-weight: 700; border: none; padding: 14px; border-radius: 8px;
    font-size: 16px; cursor: pointer; transition: 0.2s; width: 100%;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { background: var(--muted); cursor: not-allowed; transform: none; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-success { background: var(--success); color: #fff; }
  
  #statusBox { text-align: center; font-size: 15px; font-weight: 600; padding: 10px; border-radius: 8px; display: none; }
  .info { background: rgba(56, 189, 248, 0.1); color: var(--accent); }
  .processing { background: rgba(245, 158, 11, 0.1); color: #F59E0B; animation: pulse 1.5s infinite; }
  .done { background: rgba(16, 185, 129, 0.1); color: var(--success); }
  
  .file-info { font-size: 14px; color: var(--muted); background: #000; padding: 10px; border-radius: 6px; display: none; word-wrap: break-word;}
  
  @keyframes pulse { 50% { opacity: 0.6; } }
</style>
</head>
<body>

<div class="container">
  <h1>Audio Compressor</h1>
  <p class="desc">MP3/MP4 ഫയലുകളെ 16kHz WAV ഫോർമാറ്റിലേക്ക് മാറ്റുക (ബ്രൗസർ റിഫ്രഷ് ചെയ്താലും ഫയൽ നഷ്ടപ്പെടില്ല)</p>

  <div class="card">
    <div id="uploadSection">
      <label style="font-size: 14px; color: var(--muted); margin-bottom: 5px; display: block;">ഫയൽ തിരഞ്ഞെടുക്കുക:</label>
      <input type="file" id="fileInput" accept="audio/*, video/*">
    </div>
    
    <div id="fileInfo" class="file-info"></div>
    
    <div id="statusBox"></div>
    
    <button id="convertBtn" class="btn" style="display: none;">⚙️ 16kHz WAV ആയി കംപ്രസ്സ് ചെയ്യുക</button>
    <button id="downloadBtn" class="btn btn-success" style="display: none;">⬇️ ഡൗൺലോഡ് ചെയ്യുക</button>
    <button id="clearBtn" class="btn btn-danger" style="display: none;">🗑️ പുതിയ ഫയൽ തിരഞ്ഞെടുക്കുക (Clear Job)</button>
  </div>
</div>

<script>
  // --- IndexedDB Setup (For saving file across refreshes) ---
  const dbName = "AudioConverterDB";
  const storeName = "pendingJobs";

  function initDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(dbName, 1);
      request.onupgradeneeded = (e) => {
        let db = e.target.result;
        if (!db.objectStoreNames.contains(storeName)) {
          db.createObjectStore(storeName);
        }
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async function saveFileToDB(file) {
    const db = await initDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, "readwrite");
      const store = tx.objectStore(storeName);
      store.put(file, "currentFile");
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function getFileFromDB() {
    const db = await initDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, "readonly");
      const store = tx.objectStore(storeName);
      const request = store.get("currentFile");
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async function clearFileFromDB() {
    const db = await initDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, "readwrite");
      const store = tx.objectStore(storeName);
      store.delete("currentFile");
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  // --- UI Elements ---
  const fileInput = document.getElementById('fileInput');
  const uploadSection = document.getElementById('uploadSection');
  const fileInfo = document.getElementById('fileInfo');
  const convertBtn = document.getElementById('convertBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const clearBtn = document.getElementById('clearBtn');
  const statusBox = document.getElementById('statusBox');

  let currentFile = null;
  let convertedBlob = null;

  function showStatus(text, className) {
    statusBox.textContent = text;
    statusBox.className = className;
    statusBox.style.display = 'block';
  }

  function updateUIState() {
    if (currentFile) {
      uploadSection.style.display = 'none';
      fileInfo.style.display = 'block';
      fileInfo.textContent = `തിരഞ്ഞെടുത്ത ഫയൽ: ${currentFile.name} (${(currentFile.size / 1024 / 1024).toFixed(2)} MB)`;
      
      if (!convertedBlob) {
        convertBtn.style.display = 'block';
        clearBtn.style.display = 'block';
        downloadBtn.style.display = 'none';
        showStatus('ഫയൽ സുരക്ഷിതമായി സേവ് ചെയ്തിട്ടുണ്ട്. കംപ്രസ്സ് ചെയ്യാൻ ബട്ടൺ അമർത്തുക.', 'info');
      } else {
        convertBtn.style.display = 'none';
        downloadBtn.style.display = 'block';
        clearBtn.style.display = 'block';
        showStatus('കംപ്രഷൻ വിജയകരമായി പൂർത്തിയായി!', 'done');
      }
    } else {
      uploadSection.style.display = 'block';
      fileInfo.style.display = 'none';
      convertBtn.style.display = 'none';
      downloadBtn.style.display = 'none';
      clearBtn.style.display = 'none';
      statusBox.style.display = 'none';
      fileInput.value = '';
    }
  }

  // --- Page Load: Check if file exists in DB ---
  window.onload = async () => {
    try {
      const savedFile = await getFileFromDB();
      if (savedFile) {
        currentFile = savedFile;
        updateUIState();
      }
    } catch (e) {
      console.error("DB Load Error", e);
    }
  };

  // --- File Selection ---
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    currentFile = file;
    convertedBlob = null;
    
    showStatus('ഫയൽ സേവ് ചെയ്യുന്നു...', 'processing');
    await saveFileToDB(currentFile);
    updateUIState();
  });

  // --- Audio Conversion Logic (WAV 16kHz) ---
  convertBtn.addEventListener('click', async () => {
    if (!currentFile) return;
    
    convertBtn.disabled = true;
    clearBtn.disabled = true;
    showStatus('ഓഡിയോ പ്രോസസ്സ് ചെയ്യുന്നു... ദയവായി കാത്തിരിക്കുക.', 'processing');
    
    try {
      const arrayBuffer = await currentFile.arrayBuffer();
      
      // 1. Decode Original Audio
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
      
      // 2. Resample to 16kHz (Mono) using OfflineAudioContext
      const TARGET_SAMPLE_RATE = 16000;
      const offlineCtx = new OfflineAudioContext(1, audioBuffer.duration * TARGET_SAMPLE_RATE, TARGET_SAMPLE_RATE);
      
      const source = offlineCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(offlineCtx.destination);
      source.start();
      
      const resampledBuffer = await offlineCtx.startRendering();
      
      // 3. Encode to WAV Format
      convertedBlob = audioBufferToWavBlob(resampledBuffer);
      
      updateUIState();
    } catch (error) {
      console.error("Conversion Error:", error);
      showStatus('കംപ്രഷൻ പരാജയപ്പെട്ടു. മറ്റൊരു ഫയൽ ശ്രമിക്കുക.', 'info');
      statusBox.style.background = 'rgba(239, 68, 68, 0.1)';
      statusBox.style.color = 'var(--danger)';
    } finally {
      convertBtn.disabled = false;
      clearBtn.disabled = false;
    }
  });

  // --- WAV Encoder Helper ---
  function audioBufferToWavBlob(buffer) {
    const numChannels = 1; // Mono
    const sampleRate = buffer.sampleRate;
    const format = 1; // PCM
    const bitDepth = 16;
    
    const channelData = buffer.getChannelData(0);
    const dataLength = channelData.length * (bitDepth / 8);
    const bufferLength = 44 + dataLength;
    const arrayBuffer = new ArrayBuffer(bufferLength);
    const view = new DataView(arrayBuffer);
    
    function writeString(view, offset, string) {
      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }
    
    // RIFF chunk descriptor
    writeString(view, 0, 'RIFF');
    view.setUint32(4, 36 + dataLength, true);
    writeString(view, 8, 'WAVE');
    
    // FMT sub-chunk
    writeString(view, 12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, format, true);
    view.setUint16(22, numChannels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * numChannels * (bitDepth / 8), true);
    view.setUint16(32, numChannels * (bitDepth / 8), true);
    view.setUint16(34, bitDepth, true);
    
    // Data sub-chunk
    writeString(view, 36, 'data');
    view.setUint32(40, dataLength, true);
    
    // Write PCM samples
    let offset = 44;
    for (let i = 0; i < channelData.length; i++) {
      let sample = Math.max(-1, Math.min(1, channelData[i])); // clamp
      sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF; // float to 16-bit
      view.setInt16(offset, sample, true);
      offset += 2;
    }
    
    return new Blob([view], { type: 'audio/wav' });
  }

  // --- Download & Clear Jobs ---
  downloadBtn.addEventListener('click', () => {
    if (!convertedBlob) return;
    const url = URL.createObjectURL(convertedBlob);
    const a = document.createElement('a');
    a.href = url;
    // യഥാർത്ഥ പേരിനൊപ്പം _16kHz എന്ന് ചേർക്കുന്നു
    const originalName = currentFile.name.split('.').slice(0, -1).join('.') || "audio";
    a.download = `${originalName}_16kHz.wav`;
    a.click();
    URL.revokeObjectURL(url);
  });

  clearBtn.addEventListener('click', async () => {
    if (confirm("ഈ ഫയൽ ഡിലീറ്റ് ചെയ്ത് പുതിയത് തിരഞ്ഞെടുക്കണോ?")) {
      await clearFileFromDB();
      currentFile = null;
      convertedBlob = null;
      updateUIState();
    }
  });

</script>

</body>
</html>
