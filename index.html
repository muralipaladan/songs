<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Audio Compressor (AAC/M4A)</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0F172A; --panel: #1E293B; --accent: #38BDF8; --text: #F8FAFC; --muted: #94A3B8; --danger: #EF4444; --success: #10B981; }
  * { box-sizing: border-box; }
  body, html { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Anek Malayalam', sans-serif; }
  
  .container { max-width: 500px; margin: 20px auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
  h1 { font-size: 22px; text-align: center; margin: 0; color: var(--accent); }
  p.desc { font-size: 14px; color: var(--muted); text-align: center; margin-top: -5px; line-height: 1.5; }
  
  .card { background: var(--panel); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 15px; }
  
  input[type="file"] {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px dashed rgba(255,255,255,0.3);
    background: rgba(0,0,0,0.2); color: var(--text); cursor: pointer;
  }
  
  .btn {
    background: var(--accent); color: #000; font-weight: 700; border: none; padding: 14px; border-radius: 8px;
    font-size: 16px; cursor: pointer; transition: 0.2s; width: 100%;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { background: var(--muted); cursor: not-allowed; transform: none; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-success { background: var(--success); color: #fff; }
  
  #statusBox { text-align: center; font-size: 14px; font-weight: 600; padding: 12px; border-radius: 8px; display: none; line-height: 1.5; }
  .info { background: rgba(56, 189, 248, 0.1); color: var(--accent); }
  .processing { background: rgba(245, 158, 11, 0.1); color: #F59E0B; animation: pulse 1.5s infinite; }
  .done { background: rgba(16, 185, 129, 0.1); color: var(--success); }
  
  .file-info { font-size: 14px; color: var(--muted); background: #000; padding: 10px; border-radius: 6px; display: none; word-wrap: break-word;}
  
  @keyframes pulse { 50% { opacity: 0.7; } }
</style>
</head>
<body>

<div class="container">
  <h1>Audio Compressor</h1>
  <p class="desc">MP3/MP4 ഫയലുകളെ AAC (.m4a) ഫോർമാറ്റിലേക്ക് മാറ്റുക <br><span style="font-size: 12px; opacity: 0.8;">(ബ്രൗസർ റിഫ്രഷ് ചെയ്താലും ഫയൽ നഷ്ടപ്പെടില്ല)</span></p>

  <div class="card">
    <div id="uploadSection">
      <label style="font-size: 14px; color: var(--muted); margin-bottom: 5px; display: block;">ഫയൽ തിരഞ്ഞെടുക്കുക:</label>
      <input type="file" id="fileInput" accept="audio/*, video/*">
    </div>
    
    <div id="fileInfo" class="file-info"></div>
    
    <div id="statusBox"></div>
    
    <button id="convertBtn" class="btn" style="display: none;">⚙️ M4A ആയി കംപ്രസ്സ് ചെയ്യുക</button>
    <button id="downloadBtn" class="btn btn-success" style="display: none;">⬇️ ഡൗൺലോഡ് ചെയ്യുക</button>
    <button id="clearBtn" class="btn btn-danger" style="display: none;">🗑️ പുതിയ ഫയൽ തിരഞ്ഞെടുക്കുക (Clear Job)</button>
  </div>
</div>

<script>
  // --- IndexedDB Setup (For saving file across refreshes) ---
  const dbName = "AudioConverterDB";
  const storeName = "pendingJobs";

  function initDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(dbName, 1);
      request.onupgradeneeded = (e) => {
        let db = e.target.result;
        if (!db.objectStoreNames.contains(storeName)) {
          db.createObjectStore(storeName);
        }
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async function saveFileToDB(file) {
    const db = await initDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, "readwrite");
      const store = tx.objectStore(storeName);
      store.put(file, "currentFile");
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function getFileFromDB() {
    const db = await initDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, "readonly");
      const store = tx.objectStore(storeName);
      const request = store.get("currentFile");
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async function clearFileFromDB() {
    const db = await initDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, "readwrite");
      const store = tx.objectStore(storeName);
      store.delete("currentFile");
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  // --- UI Elements ---
  const fileInput = document.getElementById('fileInput');
  const uploadSection = document.getElementById('uploadSection');
  const fileInfo = document.getElementById('fileInfo');
  const convertBtn = document.getElementById('convertBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const clearBtn = document.getElementById('clearBtn');
  const statusBox = document.getElementById('statusBox');

  let currentFile = null;
  let convertedBlob = null;
  let convertedExtension = 'm4a';

  function showStatus(text, className) {
    statusBox.innerHTML = text;
    statusBox.className = className;
    statusBox.style.display = 'block';
  }

  function updateUIState() {
    if (currentFile) {
      uploadSection.style.display = 'none';
      fileInfo.style.display = 'block';
      fileInfo.textContent = `തിരഞ്ഞെടുത്ത ഫയൽ: ${currentFile.name} (${(currentFile.size / 1024 / 1024).toFixed(2)} MB)`;
      
      if (!convertedBlob) {
        convertBtn.style.display = 'block';
        clearBtn.style.display = 'block';
        downloadBtn.style.display = 'none';
        showStatus('ഫയൽ സുരക്ഷിതമായി സേവ് ചെയ്തിട്ടുണ്ട്. കംപ്രസ്സ് ചെയ്യാൻ ബട്ടൺ അമർത്തുക.', 'info');
      } else {
        convertBtn.style.display = 'none';
        downloadBtn.style.display = 'block';
        clearBtn.style.display = 'block';
        showStatus('കംപ്രഷൻ വിജയകരമായി പൂർത്തിയായി!', 'done');
      }
    } else {
      uploadSection.style.display = 'block';
      fileInfo.style.display = 'none';
      convertBtn.style.display = 'none';
      downloadBtn.style.display = 'none';
      clearBtn.style.display = 'none';
      statusBox.style.display = 'none';
      fileInput.value = '';
    }
  }

  // --- Page Load: Check if file exists in DB ---
  window.onload = async () => {
    try {
      const savedFile = await getFileFromDB();
      if (savedFile) {
        currentFile = savedFile;
        updateUIState();
      }
    } catch (e) {
      console.error("DB Load Error", e);
    }
  };

  // --- File Selection ---
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    currentFile = file;
    convertedBlob = null;
    
    showStatus('ഫയൽ സേവ് ചെയ്യുന്നു...', 'processing');
    await saveFileToDB(currentFile);
    updateUIState();
  });

  // --- AAC (.m4a) Conversion Logic using MediaRecorder ---
  convertBtn.addEventListener('click', async () => {
    if (!currentFile) return;
    
    convertBtn.disabled = true;
    clearBtn.disabled = true;
    showStatus('ഓഡിയോ തയ്യാറാക്കുന്നു... ദയവായി കാത്തിരിക്കുക.', 'processing');
    
    try {
      const arrayBuffer = await currentFile.arrayBuffer();
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
      
      // ഡീകോഡ് ചെയ്ത ഓഡിയോ പ്ലേ ചെയ്ത് റെക്കോർഡ് ചെയ്യാനുള്ള സജ്ജീകരണം
      const dest = audioCtx.createMediaStreamDestination();
      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(dest);
      
      // ബ്രൗസർ സപ്പോർട്ട് അനുസരിച്ച് ഫോർമാറ്റ് തീരുമാനിക്കുന്നു
      let mimeType = 'audio/mp4'; 
      convertedExtension = 'm4a';
      
      if (!MediaRecorder.isTypeSupported(mimeType)) {
          mimeType = 'audio/webm;codecs=opus';
          convertedExtension = 'webm';
      }
      
      const recorder = new MediaRecorder(dest.stream, { mimeType: mimeType });
      const chunks = [];
      
      recorder.ondataavailable = e => {
        if (e.data.size > 0) chunks.push(e.data);
      };
      
      recorder.onstop = () => {
        convertedBlob = new Blob(chunks, { type: mimeType });
        updateUIState();
        audioCtx.close();
      };
      
      // പാട്ട് പ്ലേ ചെയ്തു തുടങ്ങുകയും റെക്കോർഡിംഗ് ആരംഭിക്കുകയും ചെയ്യുന്നു
      source.start(0);
      recorder.start();
      
      // കംപ്രഷൻ ശതമാനം കാണിക്കാൻ
      const duration = audioBuffer.duration;
      const startTime = Date.now();
      
      const timerInterval = setInterval(() => {
        const elapsed = (Date.now() - startTime) / 1000;
        const percent = Math.min(99, Math.round((elapsed / duration) * 100));
        
        let formatNote = convertedExtension === 'm4a' ? 'AAC (.m4a)' : 'Opus (.webm)';
        showStatus(`കംപ്രസ്സ് ചെയ്യുന്നു... <b>${percent}%</b> പൂർത്തിയായി<br><span style="font-size:12px; opacity:0.8;">(ബ്രൗസർ ക്ലോസ് ചെയ്യരുത്. ഫോർമാറ്റ്: ${formatNote})</span>`, 'processing');
        
        if (elapsed >= duration) {
            clearInterval(timerInterval);
        }
      }, 1000);
      
      source.onended = () => {
        clearInterval(timerInterval);
        if (recorder.state === 'recording') {
            recorder.stop();
        }
      };
      
    } catch (error) {
      console.error("Conversion Error:", error);
      showStatus('കംപ്രഷൻ പരാജയപ്പെട്ടു. മറ്റൊരു ഫയൽ ശ്രമിക്കുക.', 'info');
      statusBox.style.background = 'rgba(239, 68, 68, 0.1)';
      statusBox.style.color = 'var(--danger)';
      convertBtn.disabled = false;
      clearBtn.disabled = false;
    }
  });

  // --- Download & Clear Jobs ---
  downloadBtn.addEventListener('click', () => {
    if (!convertedBlob) return;
    const url = URL.createObjectURL(convertedBlob);
    const a = document.createElement('a');
    a.href = url;
    
    // യഥാർത്ഥ പേരിനൊപ്പം എക്സ്റ്റൻഷൻ മാറ്റുന്നു
    const originalName = currentFile.name.split('.').slice(0, -1).join('.') || "audio";
    a.download = `${originalName}_compressed.${convertedExtension}`;
    
    a.click();
    URL.revokeObjectURL(url);
  });

  clearBtn.addEventListener('click', async () => {
    if (confirm("ഈ ഫയൽ ഡിലീറ്റ് ചെയ്ത് പുതിയത് തിരഞ്ഞെടുക്കണോ?")) {
      await clearFileFromDB();
      currentFile = null;
      convertedBlob = null;
      updateUIState();
    }
  });

</script>

</body>
</html>
